<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>首页轮播管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="js/easyui/themes/default/easyui.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container-fluid p-3">
    <div class="panel-heading">首页轮播管理</div>
    <div style="margin-bottom:10px;">
        <button class="btn btn-primary btn-sm" id="addBtn">新增轮播</button>
    </div>
    <table id="dg" class="easyui-datagrid" style="width:100%;height:450px;"
        data-options="singleSelect:true,pagination:true,rownumbers:true,fitColumns:true">
        <thead>
            <tr>
                <th data-options="field:'id',width:60">ID</th>
                <th data-options="field:'thumb',width:200,formatter:imgFormatter">轮播图片</th>
                <th data-options="field:'ord',width:80">排序</th>
                <th data-options="field:'_op',width:150,formatter:opFormatter">操作</th>
            </tr>
        </thead>
    </table>
</div>

<div id="addDlg" class="easyui-dialog" title="新增轮播" style="width:400px;padding:20px;" data-options="closed:true,modal:true">
    <form id="addForm" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label>轮播图片(altpic)</label>
            <input type="file" class="form-control" name="altpic" id="altpic" accept="image/jpeg,image/png">
        </div>
        <div class="form-group">
            <label>排序(ord)</label>
            <input type="number" class="form-control" name="ord" id="addOrd" value="0">
        </div>
        <button type="button" class="btn btn-primary" id="addSubmitBtn">提交</button>
    </form>
</div>

<div id="editDlg" class="easyui-dialog" title="编辑轮播" style="width:400px;padding:20px;" data-options="closed:true,modal:true">
    <form id="editForm" method="post" enctype="multipart/form-data">
        <input type="hidden" name="id" id="editId">
        <div class="form-group">
            <label>轮播图片(altpic)</label>
            <input type="file" class="form-control" name="altpic" id="editAltpic" accept="image/jpeg,image/png">
            <div id="editPicPreview" style="margin-top:5px;"></div>
        </div>
        <div class="form-group">
            <label>排序(ord)</label>
            <input type="number" class="form-control" name="ord" id="editOrd" value="0">
        </div>
        <button type="button" class="btn btn-primary" id="editSubmitBtn">提交</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js"></script>
<script src="js/easyui/jquery.easyui.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.4.0/dist/axios.min.js"></script>
<script src="js/common.js"></script>
<script>
    function imgFormatter(val) {
        if (val) return '<img src="/' + val + '" height="40">';
        return '';
    }
    function statusFormatter(val) {
        return val == 0 ? '显示' : '隐藏';
    }
    function opFormatter(val, row) {
        return '<a href="javascript:void(0)" onclick="editRow(' + row.id + ')">编辑</a> ' +
               '<a href="javascript:void(0)" onclick="delRow(' + row.id + ')">删除</a> ' +
               '<a href="javascript:void(0)" onclick="toggleStatus(' + row.id + ',' + (row.ctype == 0 ? 1 : 0) + ')">' + (row.ctype == 0 ? '隐藏' : '显示') + '</a>';
    }

    function loadData() {
        axiosGet(API_BASE + '/altpic/index', { page: 1, rows: 20 }, function(res) {
            //alert(JSON.stringify(res.data.rows));
            $("#dg").datagrid('loadData', { total: res.data.total, rows: res.data.rows });
        });
    }

    $(function() {
        loadData();
        $('#addBtn').click(function() {
            $('#addForm')[0].reset();
            $('#addDlg').dialog('open');
        });
        $('#addSubmitBtn').click(function() {
            var fd = new FormData($('#addForm')[0]);
            axiosPost(API_BASE + '/altpic/insert', fd, function(res) {
                alert(res.msg);
                $('#addDlg').dialog('close');
                loadData();
            });
        });
        $('#editSubmitBtn').click(function() {
            var fd = new FormData($('#editForm')[0]);
            axiosPost(API_BASE + '/altpic/update', fd, function(res) {
                alert(res.msg);
                $('#editDlg').dialog('close');
                loadData();
            });
        });
    });

    function editRow(id) {
        var rows = $('#dg').datagrid('getRows');
        var row = rows.find(function(r) { return r.id == id; });
        if (!row) return;
        $('#editId').val(row.id);
        $('#editOrd').val(row.ord);
        $('#editPicPreview').html(row.pic ? '<img src="/' + row.pic + '" height="60">' : '');
        $('#editAltpic').val('');
        $('#editDlg').dialog('open');
    }

    function delRow(id) {
        if (!confirm('确定删除？')) return;
        axiosPost(API_BASE + '/altpic/delete', { id: id }, function(res) {
            alert(res.msg);
            loadData();
        });
    }

    function toggleStatus(id, ctype) {
        axiosPost(API_BASE + '/altpic/updateStatus', { id: id, ctype: ctype }, function(res) {
            loadData();
        });
    }
</script>
</body>
</html>
