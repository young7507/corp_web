<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>最新消息添加</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@kazura/ueditor@1.5.0/ueditor.config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@kazura/ueditor@1.5.0/ueditor.all.min.js"></script>
</head>
<body>
<div class="container-fluid p-3">
    <div class="panel-heading">最新消息添加</div>
    <form id="addForm" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label>标题(title)</label>
            <input type="text" class="form-control" name="title" id="title" placeholder="请输入标题">
        </div>
        <div class="form-group">
            <label>副标题(subtitle)</label>
            <input type="text" class="form-control" name="subtitle" id="subtitle" placeholder="请输入副标题">
        </div>
        <div class="form-group">
            <label>所属分类(category)</label>
            <select class="form-control" name="category" id="category"></select>
        </div>
        <div class="form-group">
            <label>缩略图(thumb)</label>
            <input type="file" class="form-control" name="thumb" id="thumb" accept="image/jpeg,image/png">
        </div>
        <div class="form-group">
            <label>内容(content)</label>
            <script id="editor" type="text/plain" style="width:100%;height:350px;"></script>
        </div>
        <div class="form-group">
            <label>是否推荐(istui)</label>
            <select class="form-control" name="istui" id="istui">
                <option value="0">否</option>
                <option value="1">是</option>
            </select>
        </div>
        <div class="form-group">
            <label>排序(ord)</label>
            <input type="number" class="form-control" name="ord" id="ord" value="0">
        </div>
        <button type="button" class="btn btn-primary" id="submitBtn">提交</button>
        <button type="button" class="btn btn-secondary" onclick="window.location.href='news.html'">返回</button>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.4.0/dist/axios.min.js"></script>
<script src="js/common.js"></script>
<script>
    var ue = UE.getEditor('editor',{toolbars:[['fullscreen', 'source', '|' , 'undo', 'redo', '|' ,'justifyleft', 'justifycenter', 'justifyright', 'justifyjustify', '|' , 'fontfamily', 'fontsize', '|','simpleupload', 'insertimage', 'emotion','|' , 'insertvideo',  'attachment',  'gmap', '|' ,'link', 'unlink', 'anchor',],['bold', 'italic', '|' , 'underline',  '|' ,'insertorderedlist', 'insertunorderedlist',  '|' ,'fontborder', 'strikethrough',  '|' ,'removeformat', 'formatmatch', 'autotypeset', 'blockquote', 'pasteplain', '|', 'forecolor', 'backcolor', '|' ,  'selectall', 'cleardoc', '|' ,'date', 'time', '|' , 'spechars' ]],initialFrameWidth:null,initialFrameHeight:320,enterTag: 'br',wordCount:false});
    $(function() {
        axiosGet(API_BASE + '/news/add', {}, function(res) {
            var list = res.data || [];
            var html = '';
            list.forEach(function(item) {
                html += '<option value="' + item.id + '">' + item.cate + '</option>';
            });
            $('#category').html(html);
        });
        $('#submitBtn').click(function() {
            var title = $('#title').val();
            var subtitle = $('#subtitle').val();
            var category = $('#category').val();
            var content = ue.getContent();
            var ord = $('#ord').val();
            if (!title || !subtitle || !category || !content || ord === '') {
                alert('标题、副标题、分类、内容、排序不能为空');
                return;
            }
            var fd = new FormData($('#addForm')[0]);
            fd.set('content', content);
            axiosPost(API_BASE + '/news/insert', fd, function(res) {
                alert(res.msg);
                window.location.href = 'news.html';
            });
        });
    });
</script>
</body>
</html>
